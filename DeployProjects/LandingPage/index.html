<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rising2 · Rising Eagle Online</title>
  <meta name="description" content="Rising2 - fan community bringing Rising Eagle: Futuristic Infantry Warfare back online.">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <!-- Icons, used with <svg><use href="#i-..."/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-discord" viewBox="0 0 24 24"><path fill="currentColor" d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></symbol>
    <symbol id="i-windows" viewBox="0 0 24 24"><path fill="currentColor" d="M0 0h11.377v11.372H0zm12.623 0H24v11.372H12.623zM0 12.623h11.377V24H0zm12.623 0H24V24H12.623z"/></symbol>
    <symbol id="i-free" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 12v8H4v-8M2 7h20v5H2zM12 20V7m0 0H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zm0 0h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7z"/></symbol>
    <symbol id="i-medal" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M7 2h10l-3 7h-4zm5 7a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm0 3 1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8zM5 2l.6 1.4L7 4l-1.4.6L5 6l-.6-1.4L3 4l1.4-.6z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="m15 5-7 7 7 7"/></symbol>
  </svg>

  <header class="top">
    <a class="brand" href="#"><img src="assets/logo.png" alt="" width="57" height="32"><span>RISING2</span></a>
    <nav>
      <a href="#why" data-i18n="nav.why"></a>
      <a href="#gallery" data-i18n="nav.gallery"></a>
      <a href="#join" data-i18n="nav.join"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
      <button id="lang" class="lang" type="button">EN</button>
      <a class="icon-btn" data-discord href="#" target="_blank" rel="noopener" aria-label="Discord"><svg><use href="#i-discord"/></svg></a>
    </nav>
  </header>

  <main>
    <!-- ================= Banner + server status ================= -->
    <div class="sun"><i class="corona" aria-hidden="true"></i><i class="corona b" aria-hidden="true"></i><img class="hero-logo" src="assets/logo.png" alt="Rising2"></div>
    <section class="hero">
      <div class="hero-text">
        <p class="kicker" data-i18n="hero.kicker"></p>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="cta">
          <a class="btn primary" data-download href="#"><svg><use href="#i-windows"/></svg><span data-i18n="cta.download"></span></a>
          <a class="btn discord" data-discord href="#" target="_blank" rel="noopener"><svg><use href="#i-discord"/></svg><span data-i18n="cta.discord"></span></a>
        </div>
      </div>

      <aside id="status" class="status-card" aria-live="polite">
        <div class="status-head">
          <span data-i18n="status.title"></span>
          <span id="pill" class="pill off">…</span>
        </div>
        <p id="status-text" class="status-text"></p>
        <p id="players" class="players" hidden></p>
        <ol id="log" class="log"></ol>
        <form id="start" class="start" hidden>
          <p class="muted" data-i18n="start.hint"></p>
          <div class="cf-turnstile"></div>
          <button class="btn primary wide" type="submit"><svg><use href="#i-play"/></svg><span data-i18n="start.btn"></span></button>
          <p id="start-msg" class="start-msg"></p>
        </form>
      </aside>
    </section>

    <!-- ================= Why ================= -->
    <section id="why" class="block">
      <h2 data-i18n="why.title"></h2>
      <div class="features">
        <article class="feature"><svg><use href="#i-free"/></svg><h3 data-i18n="why.free"></h3><p data-i18n="why.free.d"></p></article>
        <article class="feature"><svg><use href="#i-play"/></svg><h3 data-i18n="why.play"></h3><p data-i18n="why.play.d"></p></article>
        <article class="feature"><svg><use href="#i-medal"/></svg><h3 data-i18n="why.ranks"></h3><p data-i18n="why.ranks.d"></p></article>
        <article class="feature"><svg><use href="#i-new"/></svg><h3 data-i18n="why.new"></h3><p data-i18n="why.new.d"></p></article>
      </div>
    </section>

    <!-- ================= Gallery =================
         Row 1: intro + one video (half width): <figure data-yt="YOUTUBE_ID"> - fill the id and the caption;
                an empty id shows a placeholder.
         Row 2: image slider (auto-advances every 2 s) on the screen of a 2007-style desktop PC:
                <figure><img ...><figcaption data-i18n=...></figure> -->
    <section id="gallery" class="block">
      <div class="gallery">
        <div class="gal-intro">
          <h2 data-i18n="gal.intro"></h2>
          <figure class="video" data-yt=""><figcaption>[Video - title TBD]</figcaption></figure>
        </div>
        <div class="gal-images">
          <h2 data-i18n="gal.title"></h2>
          <div class="pc" aria-label="Screenshots">
            <div class="scene">
            <div class="desk">
              <div class="surface" aria-hidden="true"><div class="keyboard"><i class="keys"></i></div><div class="mouse"></div></div>
              <div class="speaker" aria-hidden="true"><span class="lside"></span><i></i><i></i></div>
              <div class="monitor">
                <div class="bezel">
                  <div class="screen">
          <div class="slider">
            <button class="nav prev" type="button" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
            <div class="track" tabindex="0">
          <figure class="fit"><img src="assets/gallery/title.jpg" alt="" loading="lazy"><figcaption data-i18n="gal.title2"></figcaption></figure>
          <figure class="fit"><img src="assets/gallery/loadout.jpg" alt="" loading="lazy"><figcaption data-i18n="gal.loadout"></figcaption></figure>
          <figure><img src="assets/gallery/courtyard.jpg" alt="" loading="lazy"><figcaption data-i18n="gal.courtyard"></figcaption></figure>
          <figure><img src="assets/gallery/arc.jpg" alt="" loading="lazy"><figcaption data-i18n="gal.arc"></figcaption></figure>
          <figure><img src="assets/gallery/china.jpg" alt="" loading="lazy"><figcaption data-i18n="gal.china"></figcaption></figure>
          <figure><img src="assets/gallery/hacking.jpg" alt="" loading="lazy"><figcaption data-i18n="gal.hacking"></figcaption></figure>
          <figure><img src="assets/gallery/trooper.jpg" alt="" loading="lazy"><figcaption data-i18n="gal.trooper"></figcaption></figure>
          <figure><img src="assets/gallery/docks.jpg" alt="" loading="lazy"><figcaption data-i18n="gal.docks"></figcaption></figure>
          <figure><img src="assets/gallery/tactical.jpg" alt="" loading="lazy"><figcaption data-i18n="gal.tactical"></figcaption></figure>
          <figure><img src="assets/gallery/menu.jpg" alt="" loading="lazy"><figcaption data-i18n="gal.menu"></figcaption></figure>
            </div>
            <button class="nav next" type="button" aria-label="Next"><svg><use href="#i-prev"/></svg></button>
          </div>
                    <div class="crt" aria-hidden="true"></div>
                    <div class="dots" aria-hidden="true"></div>
                  </div>
                  <div class="chin" aria-hidden="true"><span class="badge">RISING2</span><span class="btns"><i></i><i></i><i></i><b class="power"></b></span></div>
                </div>
                <div class="neck" aria-hidden="true"></div>
                <div class="foot" aria-hidden="true"></div>
              </div>
              <div class="speaker" aria-hidden="true"><span class="lside"></span><i></i><i></i></div>
              <div class="tower" aria-hidden="true">
                <span class="lside"></span>
                <span class="leds"><b class="pwr"></b><b class="hdd"></b></span>
                <span class="bay"></span>
                <span class="bay drive"><span class="tray"><i class="bed"></i><b class="eject"></b></span></span>
                <span class="floppy"></span>
                <span class="vents"></span>
                <span class="badge">R2</span>
              </div>
            </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= How to join ================= -->
    <section id="join" class="join">
      <h2 data-i18n="join.title"></h2>
      <p class="join-sub" data-i18n="join.sub"></p>
      <ol class="steps">
        <li><span class="n">1</span><h3 data-i18n="join.s1"></h3><p data-i18n="join.s1.d"></p></li>
        <li><span class="n">2</span><h3 data-i18n="join.s2"></h3><p data-i18n="join.s2.d"></p></li>
      </ol>
      <div class="join-cta">
        <a class="btn primary big" data-download href="#"><svg><use href="#i-windows"/></svg><span data-i18n="cta.download"></span></a>
        <a class="btn discord big" data-discord href="#" target="_blank" rel="noopener"><svg><use href="#i-discord"/></svg><span data-i18n="cta.discord"></span></a>
      </div>
    </section>

    <!-- ================= About ================= -->
    <section id="about" class="block">
      <h2 data-i18n="about.title"></h2>
      <div class="cols">
        <p data-i18n="about.p1"></p>
        <p data-i18n="about.p2"></p>
      </div>
    </section>

    <!-- ================= FAQ (always open) ================= -->
    <section id="faq" class="block">
      <h2 data-i18n="faq.title"></h2>
      <dl class="faq">
        <div><dt data-i18n="faq.q1"></dt><dd data-i18n="faq.a1"></dd></div>
        <div><dt data-i18n="faq.q2"></dt><dd data-i18n="faq.a2"></dd></div>
        <div><dt data-i18n="faq.q3"></dt><dd><span data-i18n="faq.a3"></span> <a data-discord href="#" target="_blank" rel="noopener">Discord</a></dd></div>
      </dl>
    </section>
  </main>

  <footer>
    <p data-i18n="footer.fan"></p>
    <p><a data-discord href="#" target="_blank" rel="noopener">Discord</a></p>
    <p class="build" dir="ltr">dev</p>
  </footer>

  <script src="app.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstile" async defer></script>
</body>
</html>
