services:
  rising2:
    build: .
    image: rising2/gamespy-unified:latest
    container_name: rising2-gamespy
    restart: unless-stopped
    # Linux host: host networking, so the server sees the real source IP of
    # every game server and player (needed for the server list).
    network_mode: host
    # Docker Desktop (Windows/macOS) without host networking: remove
    # network_mode above, use the ports below, and set R2_SB_OVERRIDE_SERVER_IP
    # to the IP players should connect to (all sources look like the NAT gateway).
    # ports:
    #   - "80:80/tcp"
    #   - "28910:28910/tcp"
    #   - "29900:29900/tcp"
    #   - "29901:29901/tcp"
    #   - "27900:27900/udp"
    #   - "27901:27901/udp"
    #   - "29910:29910/udp"
    volumes:
      # LoginDatabase.db3 (an existing one from the old C# server works as-is),
      # rising2_stats.db, reports/, logs/, plus create_empty_db.py + schemas
      - ./data:/data
      # config/rules.py (stats logic, reloaded on save) and config/missing/
      # (stats we don't handle yet) - writable on purpose
      - ./config:/app/config
    environment:
      R2_LOG_LEVEL: DEBUG          # DEBUG = hex dumps + full SOAP bodies, INFO = one line per event
      R2_CERT_MODE: per_user       # per_user | canned (see README "Matching players to reports")
      # R2_SB_OVERRIDE_SERVER_IP: 203.0.113.10
      # R2_MOTD: "Welcome to Rising2"
