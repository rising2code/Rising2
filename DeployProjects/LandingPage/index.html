<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rising2 · Rising Eagle Online</title>
  <meta name="description" content="Rising2 - fan community bringing Rising Eagle: Futuristic Infantry Warfare back online.">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#"><img src="assets/logo.png" alt="" width="36" height="36"><span>RISING2</span></a>
    <nav>
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#positions" data-i18n="nav.positions"></a>
      <a href="#join" data-i18n="nav.join"></a>
      <button id="lang" class="lang" type="button">EN</button>
    </nav>
  </header>

  <main>
    <!-- ================= Banner + server status ================= -->
    <section class="hero">
      <div class="hero-text">
        <p class="kicker" data-i18n="hero.kicker"></p>
        <img class="hero-logo" src="assets/logo.png" alt="Rising2">
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="cta">
          <a class="btn discord" data-discord href="#" target="_blank" rel="noopener" data-i18n="cta.discord"></a>
          <a class="btn ghost" href="#join" data-i18n="cta.how"></a>
        </div>
      </div>

      <aside class="status-card" aria-live="polite">
        <div class="status-head">
          <span data-i18n="status.title"></span>
          <span id="pill" class="pill off">…</span>
        </div>
        <p id="status-text" class="status-text"></p>
        <ol id="log" class="log"></ol>

        <form id="start" class="start" hidden>
          <p class="muted" data-i18n="start.hint"></p>
          <div class="cf-turnstile" data-theme="dark"></div>
          <button class="btn primary" type="submit" data-i18n="start.btn"></button>
          <p id="start-msg" class="start-msg"></p>
        </form>
        <p class="addr"><span data-i18n="status.addr"></span> <code>ip.rising2.net</code></p>
      </aside>
    </section>

    <!-- ================= About ================= -->
    <section id="about" class="block">
      <h2 data-i18n="about.title"></h2>
      <div class="cols">
        <p data-i18n="about.p1"></p>
        <p data-i18n="about.p2"></p>
      </div>
      <ul class="facts">
        <li><b>2040</b><span data-i18n="facts.year"></span></li>
        <li><b>3</b><span data-i18n="facts.factions"></span></li>
        <li><b>2×3×5</b><span data-i18n="facts.platoon"></span></li>
        <li><b>6</b><span data-i18n="facts.positions"></span></li>
      </ul>
    </section>

    <!-- ================= Positions ================= -->
    <section id="positions" class="block">
      <h2 data-i18n="pos.title"></h2>
      <div class="grid">
        <article class="card"><span class="num">01</span><h3 data-i18n="pos.trooper"></h3><p data-i18n="pos.trooper.d"></p></article>
        <article class="card"><span class="num">02</span><h3 data-i18n="pos.sniper"></h3><p data-i18n="pos.sniper.d"></p></article>
        <article class="card"><span class="num">03</span><h3 data-i18n="pos.hacker"></h3><p data-i18n="pos.hacker.d"></p></article>
        <article class="card"><span class="num">04</span><h3 data-i18n="pos.abe"></h3><p data-i18n="pos.abe.d"></p></article>
        <article class="card"><span class="num">05</span><h3 data-i18n="pos.sl"></h3><p data-i18n="pos.sl.d"></p></article>
        <article class="card"><span class="num">06</span><h3 data-i18n="pos.pl"></h3><p data-i18n="pos.pl.d"></p></article>
      </div>
    </section>

    <!-- ================= Ranks ================= -->
    <section class="block ranks">
      <h2 data-i18n="rank.title"></h2>
      <p data-i18n="rank.p"></p>
      <div class="rank-bar" aria-hidden="true"><span>PVT</span><span>SGT</span><span>MCPO</span><span>LT</span><span>CPT</span><span>MAJ</span></div>
      <p class="muted" data-i18n="rank.medals"></p>
    </section>

    <!-- ================= How to join ================= -->
    <section id="join" class="block">
      <h2 data-i18n="join.title"></h2>
      <ol class="steps">
        <li><h3 data-i18n="join.s1"></h3><p data-i18n="join.s1.d"></p></li>
        <li><h3 data-i18n="join.s2"></h3><p data-i18n="join.s2.d"></p></li>
        <li><h3 data-i18n="join.s3"></h3><p data-i18n="join.s3.d"></p></li>
        <li><h3 data-i18n="join.s4"></h3><p data-i18n="join.s4.d"></p></li>
      </ol>
      <div class="note"><h3 data-i18n="lazy.title"></h3><p data-i18n="lazy.p"></p></div>
    </section>
  </main>

  <footer>
    <p data-i18n="footer.fan"></p>
    <p><a data-discord href="#" target="_blank" rel="noopener">Discord</a> · <a href="https://github.com/yonixw/Rising2" target="_blank" rel="noopener">GitHub</a></p>
  </footer>

  <script src="app.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstile" async defer></script>
</body>
</html>
