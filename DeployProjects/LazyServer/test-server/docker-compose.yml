# Rising2 TEST server: stands in for the real game servers while their compose is being finished,
# so the whole loop (start, DNS, status, idle shutdown, stop, teardown) can be tested on a real VM.
# Uploaded to R2 by Deploy step 05a (05b uploads the real ../docker-compose.yml instead).
#
#   hello   http://ip.<domain>/            a "test server is up" page
#           http://127.0.0.1/rising2/status  {"servers": []} = 0 players, so the idle check counts and
#                                           the VM tears itself down after ~30 min, like a real empty server
#   dozzle  every container's live logs, on the VM only (127.0.0.1:8080). From your PC:
#             ssh -L 8080:localhost:8080 debian@ip.<domain>     then open http://localhost:8080
#           (needs SSH_PUBLIC_KEY in Deploy step 08, so the VM lets your key in)

services:
  hello:
    image: busybox:1.37.0
    restart: unless-stopped
    ports: ["80:80"]
    command:
      - sh
      - -c
      - |
        mkdir -p /www/rising2
        echo '{"servers": []}' > /www/rising2/status
        echo "<h1>Rising2 test server</h1><p>${TEST_MESSAGE:-Up.} Logs: Dozzle on 127.0.0.1:8080 through SSH.</p>" > /www/index.html
        exec httpd -f -v -p 80 -h /www

  dozzle:
    image: amir20/dozzle:v8.14.12
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    environment:
      DOZZLE_NO_ANALYTICS: "true"
